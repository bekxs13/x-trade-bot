name: dashboard

# Publishes docs/ (the dashboard) to GitHub Pages. It only redeploys when the page itself changes;
# the 5-minute state commits don't touch docs/, and the page reads live data straight from the repo.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Packing and publishing are separate jobs (GitHub's own layout): publishing right after the upload in the same job
  # sometimes ran before GitHub had registered the upload and failed with "No artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
